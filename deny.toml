# cargo-deny license audit for the tpt-av-audio-* workspace.
#
# Policy (spec2 §7): permissive licenses only. The allow list below is the
# complete set of acceptable licenses — anything not on it is denied,
# which explicitly bans GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0, AGPL-3.0,
# and MPL-2.0, so the dual MIT OR Apache-2.0 licensing of this workspace
# can never be contaminated transitively.
#
# Note: the workspace decision overrides spec2's "pure MIT" wording — the
# crates remain dual MIT / Apache-2.0.
#
# "Apache-2.0" is deliberately absent from the allow list below: this
# workspace additionally requires every dependency to offer an MIT
# alternative, so a crate licensed as Apache-2.0-only (no MIT term) is
# rejected. A dual `MIT OR Apache-2.0` crate still passes, because
# cargo-deny accepts an SPDX OR-expression as soon as one of its terms is
# allowed, and `MIT` is.

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Required for `unicode-ident` (via syn/serde_derive), which is dual
    # licensed "(MIT OR Apache-2.0) AND Unicode-3.0". The Unicode license is
    # a permissive data license, not copyleft; without it serde cannot be
    # used.
    "Unicode-3.0",
]

[advisories]
version = 2
# RustSec advisory database check: known vulnerabilities are a hard failure
# in CI (see the `security` job). `yanked` versions are denied too.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Supply-chain: dependencies may only come from crates.io, plus the
# tpt-cadence codec suite (git, `cadence` feature only) and the shared
# tpt-av-test harness (git, dev-dependency only) until they're published
# to crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/tpt-solutions/tpt-cadence",
    "https://github.com/tpt-solutions/tpt-av-test",
]
