name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all

      - name: Test
        run: cargo test --all

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Full audit: licenses (deny.toml allow list), RustSec advisories,
      # duplicate/wildcard bans, and dependency sources. See SECURITY.md.
      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # workspace.package.rust-version — the supported floor.
      - uses: dtolnay/rust-toolchain@1.75

      - name: Check MSRV
        run: cargo check --all
