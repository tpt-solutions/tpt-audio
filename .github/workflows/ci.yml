name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all

      - name: Test
        run: cargo test --all

  cadence:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (cadence feature)
        run: cargo build --workspace --features tpt-av-audio-core/cadence

      - name: Test (cadence feature)
        run: cargo test --workspace --features tpt-av-audio-core/cadence

  clap:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # clack-host's MSRV (1.85) exceeds this workspace's floor (1.75, see
      # the msrv job), so the clap feature is exercised only here, on
      # stable, and deliberately left out of the msrv job below.
      - name: Build (clap feature)
        run: cargo build --workspace --features tpt-av-audio/clap

      - name: Test (clap feature)
        run: cargo test --workspace --features tpt-av-audio/clap

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Full audit: licenses (deny.toml allow list), RustSec advisories,
      # duplicate/wildcard bans, and dependency sources. See SECURITY.md.
      - name: cargo-deny (licenses, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # workspace.package.rust-version — the supported floor.
      - uses: dtolnay/rust-toolchain@1.120

      - name: Check MSRV
        run: cargo check --all
