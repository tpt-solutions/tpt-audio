[workspace]
resolver = "2"
members = [
    "tpt-av-audio",
    "tpt-av-audio-utils",
    "tpt-av-audio-timeline",
    "tpt-av-audio-core",
    "tpt-av-audio-io",
    "tpt-av-audio-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-audio"
rust-version = "1.75"

[workspace.dependencies]
tpt-av-audio = { path = "tpt-av-audio", version = "0.1.0" }
tpt-av-audio-utils = { path = "tpt-av-audio-utils", version = "0.1.0" }
tpt-av-audio-timeline = { path = "tpt-av-audio-timeline", version = "0.1.0" }
tpt-av-audio-core = { path = "tpt-av-audio-core", version = "0.1.0" }
tpt-av-audio-io = { path = "tpt-av-audio-io", version = "0.1.0" }
tpt-av-audio-plugin = { path = "tpt-av-audio-plugin", version = "0.1.0" }
# tpt-cadence (audio codecs): git deps on https://github.com/tpt-solutions/tpt-cadence,
# enabled via the `cadence` feature of tpt-av-audio-core.
arc-swap = "1.7"
log = "0.4"
rubato = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
] }

# CLAP plugin hosting (crates.io, MIT OR Apache-2.0), enabled via the
# `clap` feature of tpt-av-audio-plugin. VST3 is not supported: the
# Steinberg VST3 SDK is GPLv3-or-proprietary dual-licensed, which conflicts
# with this workspace's MIT/Apache-2.0-only deny.toml policy.
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "params"] }

# tpt-cadence codec crates (optional; permissive MIT OR Apache-2.0).
tpt-av-cadence-core = { git = "https://github.com/tpt-solutions/tpt-cadence", package = "tpt-av-cadence-core" }
tpt-av-cadence-wav = { git = "https://github.com/tpt-solutions/tpt-cadence", package = "tpt-av-cadence-wav" }
tpt-av-cadence-aiff = { git = "https://github.com/tpt-solutions/tpt-cadence", package = "tpt-av-cadence-aiff" }
tpt-av-cadence-flac = { git = "https://github.com/tpt-solutions/tpt-cadence", package = "tpt-av-cadence-flac" }

# Shared real-time test/benchmark harness (dev-dependency only).
tpt-av-test-benchmark = { git = "https://github.com/tpt-solutions/tpt-av-test", package = "tpt-av-test-benchmark", default-features = false }
